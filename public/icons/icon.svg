<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#4cc9f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  <!-- Lightning bolt -->
  <path d="M 280 80 L 180 260 L 240 260 L 200 432 L 340 220 L 270 220 L 320 80 Z" 
        fill="url(#glow)" 
        stroke="#00f5ff" 
        stroke-width="4"/>
  <!-- Glow effect -->
  <path d="M 280 80 L 180 260 L 240 260 L 200 432 L 340 220 L 270 220 L 320 80 Z" 
        fill="none" 
        stroke="#00f5ff" 
        stroke-width="8" 
        opacity="0.3"
        filter="blur(10px)"/>
  <!-- Text -->
  <text x="256" y="490" 
        font-family="monospace" 
        font-size="36" 
        font-weight="bold" 
        fill="#00f5ff" 
        text-anchor="middle"
        letter-spacing="8">THUNDERSTORM</text>
</svg>
