<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020205"/>
      <stop offset="50%" style="stop-color:#050508"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </linearGradient>
    <linearGradient id="splashGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#4cc9f0"/>
    </linearGradient>
  </defs>
  <!-- Dark cyberpunk background -->
  <rect width="1080" height="1920" fill="url(#splashBg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#00f5ff" opacity="0.1"/>
  </pattern>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <!-- Lightning bolt -->
  <path d="M 580 400 L 420 860 L 520 860 L 440 1300 L 680 760 L 560 760 L 660 400 Z" 
        fill="url(#splashGlow)" 
        stroke="#00f5ff" 
        stroke-width="6"/>
  <!-- Glow effect -->
  <path d="M 580 400 L 420 860 L 520 860 L 440 1300 L 680 760 L 560 760 L 660 400 Z" 
        fill="none" 
        stroke="#00f5ff" 
        stroke-width="16" 
        opacity="0.4"/>
  <!-- Title -->
  <text x="540" y="1500" 
        font-family="monospace" 
        font-size="72" 
        font-weight="bold" 
        fill="#00f5ff" 
        text-anchor="middle"
        letter-spacing="16">THUNDERSTORM</text>
  <text x="540" y="1580" 
        font-family="monospace" 
        font-size="48" 
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.6"
        letter-spacing="24">R A D I O</text>
  <!-- Loading indicator -->
  <text x="540" y="1750" 
        font-family="monospace" 
        font-size="24" 
        fill="#00f5ff" 
        text-anchor="middle"
        opacity="0.5"
        letter-spacing="8">INITIALIZING...</text>
</svg>
